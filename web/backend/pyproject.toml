[project]
name = "backend"
version = "0.0.0"
description = "NOZERO backend"
readme = "README.md"
authors = [
    { name = "Nikita Silaev", email = "notsilaev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
